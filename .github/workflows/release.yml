name: Release

# Pushing a tag like v2.0.0 builds the app and attaches the zip to a GitHub
# Release, so users can download it from the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches tag
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || {
            echo "VERSION file ($(cat VERSION)) does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Build, test and bundle
        run: ./build-app.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Instant Release $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file .github/release-notes.md
